name: runa

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-runa}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # ports:
    #   - "${DB_PORT:-5432}:5432"

  auth-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NOTE: GHCR image sign-up form has client-side validation issues.
  # Create users via API instead:
  #   curl -sk -X POST https://localhost:3001/sign-up/email \
  #     -H 'Content-Type: application/json' \
  #     -d '{"name":"...","email":"...","password":"...","tosAccepted":true,"privacyPolicyAccepted":true}'
  # Then verify email: docker compose exec auth-db psql -U postgres -d auth \
  #   -c "UPDATE \"user\" SET email_verified = true WHERE email = '...';"
  auth:
    image: manifold.omni.dev/omnidotdev/gatekeeper-app:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME:-auth}
      VITE_APP_URL: ${AUTH_BASE_URL:-http://localhost:3001}
      VITE_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3001}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      TRUSTED_DOMAIN: ${TRUSTED_DOMAIN:-localhost}
      SENDER_EMAIL_ADDRESS: ${SENDER_EMAIL_ADDRESS:-noreply@localhost}
      ENABLE_BREACH_CHECK: ${ENABLE_BREACH_CHECK:-false}
      # Override build-time Vite values that assume cloud infrastructure
      VITE_FLAGS_API_HOST: ""
      # Auto-seed OAuth client for self-hosted (reads by seedOAuthClient.mjs on boot)
      DEFAULT_CLIENT_ID: ${AUTH_CLIENT_ID:?AUTH_CLIENT_ID is required}
      DEFAULT_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:?AUTH_CLIENT_SECRET is required}
      DEFAULT_CLIENT_REDIRECT_URIS: ${BASE_URL:-http://localhost}/api/auth/oauth2/callback/omni
    depends_on:
      auth-db:
        condition: service_healthy

  api:
    image: manifold.omni.dev/omnidotdev/runa-api:latest
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-runa}
      PORT: "4000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      # Skip TLS verification for internal calls to Caddy (mkcert CA not in container)
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      CORS_ALLOWED_ORIGINS: ${BASE_URL:-http://localhost}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3001}
      AUTHZ_ENABLED: "false"
      # Object storage for task attachments (MinIO, S3-compatible)
      S3_BUCKET: ${S3_BUCKET:-runa-content}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      # Attachments are streamed through the API, so this must be browser-reachable
      PUBLIC_API_URL: ${API_BASE_URL:-http://localhost:4000}
      # Public origin of the web app, used to build task links in notification emails
      APP_BASE_URL: ${BASE_URL:-http://localhost}
      # Transactional email (Herald). Unset leaves notification emails a graceful noop
      HERALD_API_URL: ${HERALD_API_URL:-}
      HERALD_API_KEY: ${HERALD_API_KEY:-}
      HERALD_FROM_EMAIL: ${HERALD_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    image: manifold.omni.dev/omnidotdev/runa-app:latest
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      NODE_ENV: production
      # Skip TLS verification for internal calls to Caddy (mkcert CA not in container)
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      BASE_URL: ${BASE_URL:-http://localhost}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      API_INTERNAL_URL: http://api:4000
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-runa}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3001}
      AUTH_INTERNAL_URL: http://auth:3000
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:?AUTH_CLIENT_ID is required}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:?AUTH_CLIENT_SECRET is required}
      # Override build-time Vite values that assume cloud infrastructure
      VITE_BILLING_BASE_URL: ""
      VITE_CONSOLE_URL: ""
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Object storage for task attachments (images, files). The API reads/writes
  # via the internal endpoint; bytes are streamed to the browser through the API.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    # ports:
    #   - "9001:9001"  # uncomment to expose the MinIO console

  # One-shot: wait for MinIO and create the attachments bucket
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_PASS: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      BUCKET: ${S3_BUCKET:-runa-content}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASS; do
        echo 'waiting for minio...'; sleep 2;
      done &&
      mc mb -p local/$$BUCKET &&
      echo 'minio bucket ready';
      "
    restart: "no"

  caddy:
    image: caddy:2-alpine
    ports:
      - "${APP_PORT_MAP:-80:80}"
      - "${AUTH_PORT:-3001}:3001"
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - api
      - auth

volumes:
  db_data:
  auth_db_data:
  minio_data:
  caddy_data:
  caddy_config:
